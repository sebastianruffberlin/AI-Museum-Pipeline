# =====================================================================
# EMBEDDING SERVICE — provider-neutral Docker Compose fragment
#
# Add this block below `services:` in the deployment's compose file.
# All infrastructure-specific values are supplied through environment
# variables. No cloud provider, host name or bucket name is assumed.
# =====================================================================

  embeddings:
    build:
      context: ${EMBEDDING_BUILD_CONTEXT:-./services/embedding}
    container_name: embeddings
    restart: unless-stopped

    environment:
      - SIGLIP_ID=${SIGLIP_ID:-google/siglip2-giant-opt-patch16-384}

      # DINOv3 is gated on Hugging Face and therefore normally requires
      # HF_TOKEN. A deployment may configure another compatible model.
      - DINO_ID=${DINO_ID:-facebook/dinov3-vitl16-pretrain-lvd1689m}
      - HF_TOKEN=${HF_TOKEN:-}

      - BGE_ID=${BGE_ID:-BAAI/bge-m3}
      - IMG_TIMEOUT=${IMG_TIMEOUT:-30}

      # Optional S3-compatible object storage for direct image access.
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}

    volumes:
      # Persist model downloads between container restarts.
      - ${EMBEDDING_MODEL_CACHE:-./data/embedding-models}:/models


# =====================================================================
# OPTIONAL REVERSE PROXY EXAMPLE
#
# A deployment may expose this service through its own reverse proxy.
# Restrict access to trusted application/orchestrator hosts where useful.
# =====================================================================
#
# embed.example.org {
#     @blocked not remote_ip {$TRUSTED_ORCHESTRATOR_IP}
#     respond @blocked "Access Denied" 403
#     reverse_proxy embeddings:8081
# }


# =====================================================================
# EXAMPLE DEPLOYMENT
# =====================================================================
#
#   docker compose up -d --build embeddings
#
#   # Health check inside the container:
#   docker exec embeddings curl -s http://localhost:8081/health
#
#   # Health check through the configured reverse proxy:
#   curl https://embed.example.org/health
