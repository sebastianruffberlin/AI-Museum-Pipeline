# =====================================================================
# PRESIGN SERVICE — provider-neutral Docker Compose fragment
#
# Optional. Required only for museum profiles using asset.mode: s3.
# Add this block below `services:` in the deployment compose file.
# =====================================================================

  presign:
    profiles: ["s3"]

    build:
      context: ${PRESIGN_BUILD_CONTEXT:-./services/presign}

    restart: unless-stopped

    environment:
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}

    ports:
      - "127.0.0.1:${PRESIGN_PORT:-8082}:8082"

# Example:
#
#   docker compose --profile s3 up -d --build presign
#   curl http://127.0.0.1:8082/health
#
# Host-side pipeline:
#
#   PRESIGN_URL=http://127.0.0.1:8082/s3/presign
